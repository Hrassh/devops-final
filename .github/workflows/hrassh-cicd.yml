name: hrassh CI/CD

on:
  push:
    branches: [main]
    paths:
      - "students/hrassh/**"
      - ".github/workflows/hrassh-cicd.yml"
  pull_request:
    branches: [main]
    paths:
      - "students/hrassh/**"
      - ".github/workflows/hrassh-cicd.yml"
  workflow_dispatch:

concurrency:
  group: hrassh-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: students/hrassh
  IMAGE_NAME: unit-converter
  CONTAINER_NAME: unit-converter
  AWS_REGION: eu-central-1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  infra:
    name: Terraform apply
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.output.outputs.public_ip }}
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure state bucket exists
        env:
          BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

      - name: Prepare SSH public key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          echo "$EC2_SSH_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "TF_VAR_public_key=$(ssh-keygen -y -f /tmp/deploy_key)" >> "$GITHUB_ENV"
          rm -f /tmp/deploy_key

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -var="aws_region=${{ env.AWS_REGION }}"

      - name: Read outputs
        id: output
        run: echo "public_ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    needs: [build, infra]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ needs.infra.outputs.public_ip }}
    env:
      HOST: ${{ needs.infra.outputs.public_ip }}
      IMAGE: ${{ secrets.DOCKER_USERNAME }}/unit-converter:${{ github.sha }}
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            if ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 ec2-user@"$HOST" true; then
              exit 0
            fi
            echo "SSH is not ready yet ($i/30)"
            sleep 10
          done
          exit 1

      - name: Run container
        run: |
          ssh -i ~/.ssh/deploy_key ec2-user@"$HOST" bash -s << EOF
          set -e
          sudo cloud-init status --wait > /dev/null
          sudo docker pull $IMAGE
          sudo docker rm -f $CONTAINER_NAME || true
          sudo docker run -d --name $CONTAINER_NAME --restart unless-stopped \
            -p 80:8000 -e APP_ENV=production -e APP_VERSION=${GITHUB_SHA::7} $IMAGE
          sudo docker image prune -af > /dev/null
          EOF

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://$HOST/health"; then
              echo
              echo "Application is available at http://$HOST"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
